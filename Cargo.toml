[package]
name = "takken-master"
version = "0.2.0"
edition = "2021"
description = "Adaptive study desktop app for the Japanese real estate license exam"
license = "MIT"

[dependencies]
eframe = { version = "0.37", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }